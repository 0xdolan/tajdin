name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Tajdîn version
      description: Shown in the footer (for example v0.1.4)
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Chrome / Edge / Brave extension, Firefox extension, Website]
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on Windows 11
  - type: input
    id: station
    attributes:
      label: Station (if relevant)
      description: Name and, if you can, the stream link (⋮ → Copy stream URL)
