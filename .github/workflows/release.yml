name: Release

# Runs when a version tag (v1.2.3) is pushed to main by the gitflow release process
# (see docs/releasing.md). Builds once, publishes a GitHub Release with installable zips,
# then submits the same zips to the Chrome Web Store and Firefox Add-ons.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      submit:
        description: Submit to the stores
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v${{ steps.version.outputs.version }}" = "${GITHUB_REF_NAME}"
      - run: pnpm check
      - run: pnpm build:extension
      - run: pnpm --filter @tajdin/extension lint:firefox
      - run: pnpm verify:release
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs > RELEASE_NOTES.md
      - name: Checksums
        working-directory: apps/extension/.output
        run: sha256sum *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Tajdîn ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            apps/extension/.output/tajdin-*-chrome.zip
            apps/extension/.output/tajdin-*-firefox.zip
            apps/extension/.output/tajdin-*-sources.zip
            apps/extension/.output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: apps/extension/.output/*.zip

  stores:
    name: Submit to Chrome Web Store and Firefox Add-ons
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.submit
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to approve each store submission by hand.
    environment: stores
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: zips
      - name: Submit
        working-directory: apps/extension
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: tajdin@0xdolan.github.io
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          V=${{ needs.build.outputs.version }}
          ARGS=""
          if [ -n "$CHROME_EXTENSION_ID" ]; then ARGS="$ARGS --chrome-zip ../../zips/tajdin-$V-chrome.zip"; else echo "::warning::Chrome secrets not set, skipping Chrome Web Store"; fi
          if [ -n "$FIREFOX_JWT_ISSUER" ]; then ARGS="$ARGS --firefox-zip ../../zips/tajdin-$V-firefox.zip --firefox-sources-zip ../../zips/tajdin-$V-sources.zip"; else echo "::warning::Firefox secrets not set, skipping Firefox Add-ons"; fi
          if [ -z "$ARGS" ]; then echo "No store credentials configured"; exit 0; fi
          pnpm exec wxt submit $ARGS
